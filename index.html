:root {
  --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --color-primary: #06b6d4;
  --color-success: #10b981;

* {

body {

  overflow-x: hidden;
  user-select: none;
  line-height: 1.4;

/* Custom Scrollbars */
.custom-scrollbar::-webkit-scrollbar {
  width: 5px;
  height: 5px;
}
.custom-scrollbar::-webkit-scrollbar-track {
  background: rgba(2, 6, 23, 0.4);
}
.custom-scrollbar::-webkit-scrollbar-thumb {
  background: #334155;
  border-radius: 9999px;
}
.custom-scrollbar::-webkit-scrollbar-thumb:hover {
  background: #06b6d4;
}

/* Laser Scan Animation for QR Scanner */
@keyframes scanLaser {
  0% {
    top: 6%;
    opacity: 0.8;
  }
  50% {
    top: 88%;
    opacity: 1;
  }
  100% {
    top: 6%;
    opacity: 0.8;
  }
}

.animate-scan-laser {
  animation: scanLaser 2s ease-in-out infinite;
}

/* Vehicle Markers on Map */
.custom-vehicle-icon {
  background: transparent;
  border: none;
}

.vehicle-pill {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  background: rgba(15, 23, 42, 0.9);
  border: 1.5px solid rgba(56, 189, 248, 0.8);
  border-radius: 50%;
  box-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
  font-size: 12px;
  transform-origin: center center;
}

.vehicle-bus .vehicle-pill {
  border-color: #f59e0b;
  box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
}

.vehicle-metro .vehicle-pill {
  border-color: #06b6d4;
  box-shadow: 0 0 12px rgba(6, 182, 212, 0.8);
  background: rgba(6, 182, 212, 0.25);
}

.vehicle-auto .vehicle-pill {
  border-color: #eab308;
  box-shadow: 0 0 8px rgba(234, 179, 8, 0.6);
}

.vehicle-emergency .vehicle-pill {
  border-color: #ef4444;
  box-shadow: 0 0 15px rgba(239, 68, 68, 0.9);
  animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite;
}

/* Map Tooltips */
.leaflet-tooltip.map-tooltip {
  background: rgba(2, 6, 23, 0.95);
  border: 1px solid rgba(6, 182, 212, 0.4);
  border-radius: 8px;
  color: #f1f5f9;
  font-family: var(--font-sans);
  padding: 6px 10px;
  font-size: 12px;
  line-height: 1.35;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.8), 0 0 15px rgba(6, 182, 212, 0.2);
}

.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
  border-top-color: rgba(6, 182, 212, 0.4);
}

.leaflet-tooltip.map-tooltip-emergency {
  background: rgba(153, 27, 27, 0.95);
  border: 2px solid #ef4444;
  color: #ffffff;
  font-weight: 700;
  font-size: 12px;
  box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
}

.glass-panel {
  background: rgba(15, 23, 42, 0.8);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.08);
}

.glass-panel-glow {
  background: rgba(15, 23, 42, 0.9);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(6, 182, 212, 0.35);
  box-shadow: 0 0 30px rgba(6, 182, 212, 0.15);
}

  }
  50% {
    box-shadow: 0 0 30px rgba(6, 182, 212, 0.6);
  }
}

.cyber-glow {
  animation: cyberGlow 3s infinite ease-in-out;
}

/**
 * Clean Grid - Simulation Engine
 * Manages deterministic urban simulation, vehicle trajectory updates,
 * congestion dynamics, signal state cycles, scenario injection, and city metrics.
 */


class SimulationEngine {
  constructor() {
    this.isCleanGridActive = false;
    this.activeScenario = null;
    this.isEmergencyActive = false;
    this.emergencyVehicle = null;

    this.metrics = { ...CITY_CONFIG.metrics.before };
    this.intersections = JSON.parse(JSON.stringify(INTERSECTIONS));
    this.vehicles = [];
    this.listeners = new Set();
    
    this.tickCount = 0;
    this.simSpeed = 1.0;
    this.animationFrameId = null;
    this.lastTimestamp = performance.now();

    this.initFleet();
  }

  initFleet() {
    this.vehicles = [];
    const vehicleTypes = [
      { type: 'car', icon: '🚗', label: 'Car', count: 18, baseSpeed: 0.00018 },
      { type: 'bike', icon: '🛵', label: 'Scooter', count: 14, baseSpeed: 0.00022 },
      { type: 'auto', icon: '🛺', label: 'Auto-Rickshaw', count: 12, baseSpeed: 0.00016 },
      { type: 'bus', icon: '🚌', label: 'City Bus', count: 6, baseSpeed: 0.00014, routeType: 'bus' },
      { type: 'metro', icon: '🚇', label: 'Metro Train', count: 4, baseSpeed: 0.00030, routeType: 'metro' }
    ];

    let vId = 1;
    vehicleTypes.forEach(spec => {
      for (let i = 0; i < spec.count; i++) {
        let path = [];
        let color = '#94a3b8';

        if (spec.routeType === 'metro') {
          const line = (i % 2 === 0) ? METRO_NETWORK.blueLine : METRO_NETWORK.greenLine;
          path = line.stations.map(s => s.coords);
          color = line.color;
        } else if (spec.routeType === 'bus') {
          const route = (i % 2 === 0) ? BUS_ROUTES[0] : BUS_ROUTES[1];
          path = route.stops.map(s => s.coords);
          color = route.color;
        } else {
          const road = ROAD_SEGMENTS[i % ROAD_SEGMENTS.length];
          path = road.path;
          if (spec.type === 'auto') color = '#eab308'; // Auto yellow
          if (spec.type === 'bike') color = '#38bdf8'; // Sky blue
          if (spec.type === 'car') color = '#f87171'; // Red / Coral
        }

        const progress = Math.random();
        const direction = Math.random() > 0.5 ? 1 : -1;

        this.vehicles.push({
          id: `v_${vId++}`,
          type: spec.type,
          icon: spec.icon,
          label: spec.label,
          path,
          color,
          progress,
          direction,
          baseSpeed: spec.baseSpeed,
          currentCoords: this.interpolatePath(path, progress),
          heading: 0
        });
      }
    });
  }

  start() {
    const loop = (timestamp) => {
      const delta = (timestamp - this.lastTimestamp) / 1000;
      this.lastTimestamp = timestamp;
      this.tick(delta);
      this.animationFrameId = requestAnimationFrame(loop);
    };
    this.animationFrameId = requestAnimationFrame(loop);
  }

  stop() {
    if (this.animationFrameId) {
      cancelAnimationFrame(this.animationFrameId);
    }
  }

  subscribe(listener) {
    this.listeners.add(listener);
    return () => this.listeners.delete(listener);
  }

  notify() {
    this.listeners.forEach(fn => fn(this.getState()));
  }

  getState() {
    return {
      isCleanGridActive: this.isCleanGridActive,
      activeScenario: this.activeScenario,
      isEmergencyActive: this.isEmergencyActive,
      emergencyVehicle: this.emergencyVehicle,
      metrics: this.metrics,
      intersections: this.intersections,
      vehicles: this.vehicles,
      tickCount: this.tickCount
    };
  }

  // Linear / multi-segment interpolation
  interpolatePath(path, progress) {
    if (!path || path.length === 0) return [12.9716, 77.5946];
    if (path.length === 1) return path[0];

    const totalSegments = path.length - 1;
    const scaled = progress * totalSegments;
    const segIndex = Math.min(Math.floor(scaled), totalSegments - 1);
    const segProgress = scaled - segIndex;

    const p1 = path[segIndex];
    const p2 = path[segIndex + 1];

    const lat = p1[0] + (p2[0] - p1[0]) * segProgress;
    const lng = p1[1] + (p2[1] - p1[1]) * segProgress;

    return [lat, lng];
  }

  calculateHeading(p1, p2) {
    const dLat = p2[0] - p1[0];
    const dLng = p2[1] - p1[1];
    return (Math.atan2(dLng, dLat) * 180) / Math.PI;
  }

  tick(delta) {
    this.tickCount++;

    // Update signal cycles
    if (this.tickCount % 60 === 0) {
      this.updateSignals();
    }

    // Dynamic speed factor based on Clean Grid state & scenario
    let globalSpeedMultiplier = this.isCleanGridActive ? 1.45 : 0.85;
    if (this.activeScenario) {
      if (this.activeScenario.id === 'sc_cars_surge' || this.activeScenario.id === 'sc_road_closure') {
        globalSpeedMultiplier *= this.isCleanGridActive ? 1.1 : 0.55;
      } else if (this.activeScenario.id === 'sc_monsoon_rain') {
        globalSpeedMultiplier *= 0.65;
      }
    }

    // Update vehicle positions
    this.vehicles.forEach(v => {
      let speed = v.baseSpeed * globalSpeedMultiplier;

      // Clean Grid boosts bus and metro speeds
      if (this.isCleanGridActive) {
        if (v.type === 'bus') speed *= 1.4; // Bus priority lane
        if (v.type === 'metro') speed *= 1.25; // Optimized headways
      }

      v.progress += v.direction * speed * (delta * 60);

      if (v.progress >= 1.0) {
        v.progress = 1.0;
        v.direction = -1;
      } else if (v.progress <= 0.0) {
        v.progress = 0.0;
        v.direction = 1;
      }

      const prevCoords = v.currentCoords;
      v.currentCoords = this.interpolatePath(v.path, v.progress);
      if (prevCoords) {
        v.heading = this.calculateHeading(prevCoords, v.currentCoords);
      }
    });

    // Update Emergency Vehicle if active
    if (this.isEmergencyActive && this.emergencyVehicle) {
      this.emergencyVehicle.progress += 0.00065 * (delta * 60);
      if (this.emergencyVehicle.progress >= 1.0) {
        this.emergencyVehicle.progress = 1.0;
      }
      this.emergencyVehicle.currentCoords = this.interpolatePath(
        this.emergencyVehicle.path,
        this.emergencyVehicle.progress
      );
    }

    // Smoothly interpolate metrics towards target state
    this.recalculateMetrics();

    // Notify subscribers every 2 frames for silky smooth 60fps performance
    if (this.tickCount % 2 === 0) {
      this.notify();
    }
  }

  updateSignals() {
    this.intersections.forEach(node => {
      if (this.isEmergencyActive) {
        // Green wave for emergency corridor
        node.signalPhase = 'GREEN';
      } else if (this.isCleanGridActive) {
        // Smart adaptive green split
        node.signalPhase = Math.random() > 0.35 ? 'GREEN' : (Math.random() > 0.5 ? 'YELLOW' : 'RED');
      } else {
        // Legacy rigid cycle
        const phases = ['RED', 'RED', 'YELLOW', 'GREEN'];
        node.signalPhase = phases[Math.floor(Math.random() * phases.length)];
      }
    });
  }

  recalculateMetrics() {
    const base = this.isCleanGridActive ? CITY_CONFIG.metrics.after : CITY_CONFIG.metrics.before;
    let targetHealth = base.trafficHealth;
    let targetCommute = base.avgCommuteMin;
    let targetTransitLoad = base.publicTransitLoad;
    let targetPollution = base.pollutionIndex;
    let targetParking = base.parkingPressure;
    let targetInterventions = base.activeInterventions;

    if (this.activeScenario) {
      const deltas = this.activeScenario.impactDeltas;
      const factor = this.isCleanGridActive ? 0.35 : 1.0; // Clean Grid mitigates scenario severity by 65%
      targetHealth += Math.round(deltas.trafficHealth * factor);
      targetCommute += Math.round(deltas.avgCommuteMin * factor);
      targetTransitLoad += Math.round(deltas.publicTransitLoad * factor);
      targetPollution += Math.round(deltas.pollutionIndex * factor);
      targetParking += Math.round(deltas.parkingPressure * factor);
      if (this.isCleanGridActive) {
        targetInterventions += 4; // Additional dynamic interventions
      }
    }

    if (this.isEmergencyActive) {
      targetInterventions += 2;
    }

    // Clamp values
    targetHealth = Math.min(99, Math.max(20, targetHealth));
    targetCommute = Math.min(75, Math.max(15, targetCommute));
    targetTransitLoad = Math.min(99, Math.max(30, targetTransitLoad));
    targetPollution = Math.min(99, Math.max(20, targetPollution));
    targetParking = Math.min(99, Math.max(15, targetParking));

    // Smooth lerp (Exponential smoothing)
    const lerp = (curr, tgt) => curr + (tgt - curr) * 0.08;
    this.metrics.trafficHealth = Math.round(lerp(this.metrics.trafficHealth, targetHealth));
    this.metrics.avgCommuteMin = Math.round(lerp(this.metrics.avgCommuteMin, targetCommute));
    this.metrics.publicTransitLoad = Math.round(lerp(this.metrics.publicTransitLoad, targetTransitLoad));
    this.metrics.pollutionIndex = Math.round(lerp(this.metrics.pollutionIndex, targetPollution));
    this.metrics.parkingPressure = Math.round(lerp(this.metrics.parkingPressure, targetParking));
    this.metrics.activeInterventions = targetInterventions;
  }

  // Toggle ⚡ ACTIVATE CLEAN GRID transformation
  toggleCleanGrid(forceState = null) {
    this.isCleanGridActive = forceState !== null ? forceState : !this.isCleanGridActive;
    
    // Update intersection congestion visual ratings
    this.intersections.forEach(node => {
      if (this.isCleanGridActive) {
        if (node.congestionLevel === 'critical') node.congestionLevel = 'moderate';
        else if (node.congestionLevel === 'heavy') node.congestionLevel = 'normal';
      } else {
        const original = INTERSECTIONS.find(i => i.id === node.id);
        if (original) node.congestionLevel = original.congestionLevel;
      }
    });

    this.notify();
    return this.isCleanGridActive;
  }

  // Trigger What-If Scenario
  setScenario(scenarioId) {
    if (!scenarioId) {
      this.activeScenario = null;
    } else {
      this.activeScenario = WHAT_IF_SCENARIOS.find(s => s.id === scenarioId) || null;
    }
    this.notify();
    return this.activeScenario;
  }

  // Trigger Emergency Corridor Preemption
  triggerEmergencyCorridor() {
    this.isEmergencyActive = true;
    this.emergencyVehicle = {
      id: 'emergency_amb_1',
      type: 'emergency',
      icon: '🚑',
      label: 'Apollo Life Ambulance (Code Red)',
      path: [
        [12.9172, 77.6228], // Silk Board
        [12.9260, 77.6762], // Bellandur
        [12.9556, 77.7011], // Marathahalli
        [12.9854, 77.7289]  // Manipal Hospital Tech Park
      ],
      progress: 0.05,
      currentCoords: [12.9172, 77.6228],
      color: '#ef4444',
      heading: 45
    };
    this.updateSignals();
    this.notify();

    // Auto-clear after completion simulation (45 seconds)
    setTimeout(() => {
      this.isEmergencyActive = false;
      this.emergencyVehicle = null;
      this.updateSignals();
      this.notify();
    }, 45000);
  }

  clearEmergencyCorridor() {
    this.isEmergencyActive = false;
    this.emergencyVehicle = null;
    this.updateSignals();
    this.notify();
  }
}

// ================= mapEngine.js =================
/**
 * Clean Grid - Interactive Google Maps-Style Engine
 * High-performance Leaflet cartography with custom Dark-Matter tiles,
 * dynamic multi-modal vehicle renderer, pulsating congestion nodes,
 * metro/bus transit overlays, and clickable Root Cause Analysis triggers.
 */


class MapEngine {
  constructor() {
    this.map = null;
    this.layers = {
      roads: null,
      metro: null,
      buses: null,
      intersections: null,
      pollution: null,
      vehicles: null,
      emergency: null,
      routeHighlight: null
    };

    this.activeFilters = {
      traffic: true,
      metro: true,
      buses: true,
      pollution: false,
      vehicles: true
    };

    this.vehicleMarkers = new Map();
    this.intersectionMarkers = new Map();
    this.pollutionCircles = [];
    this.onIntersectionClick = null;
    this.lastStateKey = '';
  }

  init(containerId = 'city-map', onIntersectionSelect = null) {
    this.onIntersectionClick = onIntersectionSelect;

    if (typeof L === 'undefined') {
      console.error('Leaflet library is required for MapEngine.');
      return;
    }

    // Initialize Map with Google Maps feel
    this.map = L.map(containerId, {
      center: CITY_CONFIG.center,
      zoom: CITY_CONFIG.defaultZoom,
      minZoom: CITY_CONFIG.minZoom,
      maxZoom: CITY_CONFIG.maxZoom,
      zoomControl: false,
      attributionControl: false
    });

    // Dark Matter CartoDB Basemap
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(this.map);

    // Create Layer Groups
    this.layers.roads = L.layerGroup().addTo(this.map);
    this.layers.metro = L.layerGroup().addTo(this.map);
    this.layers.buses = L.layerGroup().addTo(this.map);
    this.layers.pollution = L.layerGroup();
    this.layers.intersections = L.layerGroup().addTo(this.map);
    this.layers.emergency = L.layerGroup().addTo(this.map);
    this.layers.routeHighlight = L.layerGroup().addTo(this.map);
    this.layers.vehicles = L.layerGroup().addTo(this.map);

    this.renderRoads();
    this.renderTransitNetworks();
    this.renderIntersections();
    this.renderPollutionZones();

    // Subscribe to simulation loop
    simulationEngine.subscribe(state => this.updateSimulationView(state));
  }

  // Render Arterial Road Network
  renderRoads() {
    this.layers.roads.clearLayers();

    ROAD_SEGMENTS.forEach(road => {
      // Glow underlay
      L.polyline(road.path, {
        color: '#38bdf8',
        weight: 6,
        opacity: 0.15,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(this.layers.roads);

      // Core road line
      L.polyline(road.path, {
        color: '#1e293b',
        weight: 3.5,
        opacity: 0.85,
        lineCap: 'round'
      }).addTo(this.layers.roads);
    });
  }

  // Render Metro Lines & Bus Transit Routes
  renderTransitNetworks() {
    this.layers.metro.clearLayers();
    this.layers.buses.clearLayers();

    // Metro Blue Line
    const blueLine = METRO_NETWORK.blueLine;
    const blueCoords = blueLine.stations.map(s => s.coords);
    L.polyline(blueCoords, {
      color: blueLine.color,
      weight: 4.5,
      opacity: 0.9,
      dashArray: '8, 6'
    }).bindTooltip(`🚇 ${blueLine.name}`, { sticky: true, className: 'map-tooltip' }).addTo(this.layers.metro);

    // Metro Green Line
    const greenLine = METRO_NETWORK.greenLine;
    const greenCoords = greenLine.stations.map(s => s.coords);
    L.polyline(greenCoords, {
      color: greenLine.color,
      weight: 4.5,
      opacity: 0.9,
      dashArray: '8, 6'
    }).bindTooltip(`🚇 ${greenLine.name}`, { sticky: true, className: 'map-tooltip' }).addTo(this.layers.metro);

    // Metro Stations
    [...blueLine.stations, ...greenLine.stations].forEach(station => {
      const icon = L.divIcon({
        className: 'custom-station-icon',
        html: `<div class="w-3.5 h-3.5 bg-slate-950 border-2 border-cyan-400 rounded-full shadow-[0_0_8px_#06b6d4] flex items-center justify-center">
                 <div class="w-1.5 h-1.5 bg-cyan-400 rounded-full"></div>
               </div>`,
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });

      L.marker(station.coords, { icon })
        .bindTooltip(`<b>${station.name}</b><br><span class="text-xs text-cyan-300 font-mono">Clean Grid Metro Station</span>`, {
          className: 'map-tooltip'
        })
        .addTo(this.layers.metro);
    });

    // Bus Routes
    BUS_ROUTES.forEach(bus => {
      const coords = bus.stops.map(s => s.coords);
      L.polyline(coords, {
        color: bus.color,
        weight: 3,
        opacity: 0.75,
        dashArray: '4, 4'
      }).bindTooltip(`🚌 ${bus.name}`, { sticky: true, className: 'map-tooltip' }).addTo(this.layers.buses);

      bus.stops.forEach(stop => {
        const busIcon = L.divIcon({
          className: 'custom-bus-stop-icon',
          html: `<div class="w-2.5 h-2.5 bg-amber-500 rounded-full border border-amber-200 shadow-[0_0_6px_#f59e0b]"></div>`,
          iconSize: [10, 10],
          iconAnchor: [5, 5]
        });

        L.marker(stop.coords, { icon: busIcon })
          .bindTooltip(`<b>${stop.name}</b><br><span class="text-xs text-amber-300 font-mono">Bus Transit Stop</span>`, {
            className: 'map-tooltip'
          })
          .addTo(this.layers.buses);
      });
    });
  }

  // Render Clickable Intersections
  renderIntersections() {
    this.layers.intersections.clearLayers();
    this.intersectionMarkers.clear();

    INTERSECTIONS.forEach(node => {
      const marker = this.createIntersectionMarker(node);
      this.intersectionMarkers.set(node.id, marker);
      marker.addTo(this.layers.intersections);
    });
  }

  createIntersectionMarker(node) {
    const isCleanGrid = simulationEngine.isCleanGridActive;
    let colorClass = 'bg-red-500 border-red-300 shadow-[0_0_15px_#ef4444] animate-pulse';
    let ringClass = 'border-red-500/40 animate-ping';
    let statusText = 'CRITICAL CONGESTION';

    if (isCleanGrid) {
      if (node.congestionLevel === 'moderate') {
        colorClass = 'bg-amber-500 border-amber-300 shadow-[0_0_12px_#eab308]';
        ringClass = 'border-amber-500/30';
        statusText = 'MODERATED BY CLEAN GRID';
      } else {
        colorClass = 'bg-emerald-500 border-emerald-300 shadow-[0_0_14px_#10b981]';
        ringClass = 'border-emerald-500/30';
        statusText = 'OPTIMIZED BY CLEAN GRID';
      }
    } else {
      if (node.congestionLevel === 'heavy') {
        colorClass = 'bg-orange-500 border-orange-300 shadow-[0_0_14px_#f97316] animate-pulse';
        ringClass = 'border-orange-500/40 animate-ping';
        statusText = 'HEAVY SATURATION';
      } else if (node.congestionLevel === 'moderate') {
        colorClass = 'bg-amber-500 border-amber-300 shadow-[0_0_10px_#eab308]';
        ringClass = 'border-amber-500/30';
        statusText = 'MODERATE PRESSURE';
      } else if (node.congestionLevel === 'normal') {
        colorClass = 'bg-emerald-500 border-emerald-300 shadow-[0_0_10px_#10b981]';
        ringClass = 'border-emerald-500/20';
        statusText = 'NORMAL FLOW';
      }
    }

    const signalBg = node.signalPhase === 'GREEN' ? 'bg-emerald-400' : (node.signalPhase === 'YELLOW' ? 'bg-amber-400' : 'bg-red-500');

    // Clean marker design without static overlapping text
    const html = `
      <div class="relative cursor-pointer group flex items-center justify-center" id="marker-${node.id}">
        <div class="absolute w-7 h-7 rounded-full border ${ringClass}"></div>
        <div class="w-4 h-4 rounded-full border-2 ${colorClass} flex items-center justify-center transition-transform duration-200 group-hover:scale-125">
          <div class="w-1.5 h-1.5 rounded-full ${signalBg}"></div>
        </div>
      </div>
    `;

    const icon = L.divIcon({
      className: 'custom-intersection-marker',
      html,
      iconSize: [28, 28],
      iconAnchor: [14, 14]
    });

    const marker = L.marker(node.coords, { icon });
    marker.bindTooltip(`
      <div class="p-1 font-sans text-xs">
        <div class="font-bold text-slate-100 text-sm">${node.name}</div>
        <div class="text-xs text-slate-300 mt-1">Signal: <span class="font-mono font-bold ${node.signalPhase === 'GREEN' ? 'text-emerald-400' : 'text-red-400'}">${node.signalPhase}</span></div>
        <div class="text-[11px] font-semibold text-cyan-400 mt-1">${statusText}</div>
        <div class="text-[10px] text-slate-400 italic mt-1">🔍 Click for Root Cause Analysis</div>
      </div>
    `, { className: 'map-tooltip' });

    marker.on('click', () => {
      if (this.onIntersectionClick) {
        this.onIntersectionClick(node);
      }
    });

    return marker;
  }

  // Render Air Quality & Pollution Zones
  renderPollutionZones() {
    this.layers.pollution.clearLayers();
    this.pollutionCircles = [];
    const isCleanGrid = simulationEngine.isCleanGridActive;

    const pollutionHotspots = [
      { coords: [12.9172, 77.6228], radius: isCleanGrid ? 350 : 850, color: '#ef4444', aqi: isCleanGrid ? 85 : 210, label: 'Silk Board Inversion' },
      { coords: [12.9854, 77.7289], radius: isCleanGrid ? 400 : 750, color: '#f97316', aqi: isCleanGrid ? 72 : 185, label: 'Tech Park Diesel Corridor' },
      { coords: [12.9634, 77.5755], radius: isCleanGrid ? 300 : 600, color: '#eab308', aqi: isCleanGrid ? 60 : 160, label: 'Market Freight Core' }
    ];

    pollutionHotspots.forEach(zone => {
      const circle = L.circle(zone.coords, {
        radius: zone.radius,
        color: zone.color,
        fillColor: zone.color,
        fillOpacity: isCleanGrid ? 0.12 : 0.25,
        weight: 1.5,
        dashArray: '5, 5'
      }).bindTooltip(`<b>${zone.label}</b><br>AQI Estimate: <span class="font-mono text-rose-400">${zone.aqi}</span><br><span class="text-xs text-slate-300">${isCleanGrid ? 'Mitigated by Clean Grid Corridor' : 'Heavy Stagnant Emissions'}</span>`, {
        className: 'map-tooltip'
      });

      circle.addTo(this.layers.pollution);
      this.pollutionCircles.push(circle);
    });
  }

  // Update real-time moving vehicles on simulation ticks
  updateSimulationView(state) {
    if (!this.map) return;

    // Check if macro state changed (CleanGrid active state or scenario)
    const currentStateKey = `${state.isCleanGridActive}_${state.activeScenario ? state.activeScenario.id : 'none'}`;
    if (this.lastStateKey !== currentStateKey) {
      this.lastStateKey = currentStateKey;
      this.renderIntersections();
      this.renderPollutionZones();
    }

    // Emergency Corridor Layer
    if (state.isEmergencyActive && state.emergencyVehicle) {
      if (!this.emergencyMarker) {
        this.layers.emergency.clearLayers();
        L.polyline(state.emergencyVehicle.path, {
          color: '#10b981',
          weight: 7,
          opacity: 0.7,
          dashArray: '10, 8'
        }).addTo(this.layers.emergency);

        const ambIcon = L.divIcon({
          className: 'ambulance-marker',
          html: `<div class="relative flex items-center justify-center">
                   <div class="absolute w-8 h-8 rounded-full bg-red-500/40 animate-ping"></div>
                   <div class="w-7 h-7 rounded-full bg-red-600 border-2 border-white shadow-[0_0_15px_#ef4444] flex items-center justify-center text-sm">
                     🚑
                   </div>
                 </div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });

        this.emergencyMarker = L.marker(state.emergencyVehicle.currentCoords, { icon: ambIcon });
        this.emergencyMarker.bindTooltip(`<b>🚨 Emergency Vehicle (Code Red)</b><br><span class="text-emerald-400 font-mono">Green Wave Corridor Active</span>`, {
          permanent: true,
          direction: 'top',
          className: 'map-tooltip-emergency'
        });
        this.emergencyMarker.addTo(this.layers.emergency);
      } else {
        this.emergencyMarker.setLatLng(state.emergencyVehicle.currentCoords);
      }
    } else {
      if (this.emergencyMarker) {
        this.layers.emergency.clearLayers();
        this.emergencyMarker = null;
      }
    }

    // Vehicle Markers
    if (!this.activeFilters.vehicles) {
      this.layers.vehicles.clearLayers();
      return;
    }

    state.vehicles.forEach(v => {
      let marker = this.vehicleMarkers.get(v.id);

      if (!marker) {
        const icon = L.divIcon({
          className: `custom-vehicle-icon vehicle-${v.type}`,
          html: `<div class="vehicle-pill text-xs select-none" style="transform: rotate(${v.heading}deg);">
                   <span>${v.icon}</span>
                 </div>`,
          iconSize: [22, 22],
          iconAnchor: [11, 11]
        });

        marker = L.marker(v.currentCoords, { icon });
        marker.bindTooltip(`<b>${v.label}</b><br><span class="text-xs text-slate-400 font-mono">Mode: ${v.type.toUpperCase()}</span>`, {
          className: 'map-tooltip'
        });
        marker.addTo(this.layers.vehicles);
        this.vehicleMarkers.set(v.id, marker);
      } else {
        marker.setLatLng(v.currentCoords);
        const el = marker.getElement();
        if (el) {
          const pill = el.querySelector('.vehicle-pill');
          if (pill) {
            pill.style.transform = `rotate(${v.heading}deg)`;
          }
        }
      }
    });
  }

  // Highlight a chosen commuter journey on the map
  highlightJourneyRoute(coordsList, modeTitle) {
    this.layers.routeHighlight.clearLayers();

    if (!coordsList || coordsList.length === 0) return;

    // Glowing cyan/emerald route line
    const poly = L.polyline(coordsList, {
      color: '#06b6d4',
      weight: 6,
      opacity: 0.9,
      lineCap: 'round',
      lineJoin: 'round',
      dashArray: '10, 8'
    }).addTo(this.layers.routeHighlight);

    this.map.fitBounds(poly.getBounds(), { padding: [80, 80], maxZoom: 14 });
  }

  clearRouteHighlight() {
    this.layers.routeHighlight.clearLayers();
  }

  toggleLayer(layerName) {
    if (this.activeFilters.hasOwnProperty(layerName)) {
      this.activeFilters[layerName] = !this.activeFilters[layerName];

      if (layerName === 'pollution') {
        if (this.activeFilters.pollution) {
          this.layers.pollution.addTo(this.map);
        } else {
          this.map.removeLayer(this.layers.pollution);
        }
      } else if (layerName === 'metro') {
        if (this.activeFilters.metro) {
          this.layers.metro.addTo(this.map);
        } else {
          this.map.removeLayer(this.layers.metro);
        }
      } else if (layerName === 'buses') {
        if (this.activeFilters.buses) {
          this.layers.buses.addTo(this.map);
        } else {
          this.map.removeLayer(this.layers.buses);
        }
      }

      return this.activeFilters[layerName];
    }
    return false;
  }

  flyToLocation(coords, zoom = 14) {
    if (this.map) {
      this.map.flyTo(coords, zoom, { duration: 1.2 });
    }
  }

  resetView() {
    if (this.map) {
      this.map.flyTo(CITY_CONFIG.center, CITY_CONFIG.defaultZoom, { duration: 1.0 });
    }
  }
}

class MultiAgentCore {
  constructor() {

  }

  renderModalContent(containerId = 'agent-core-modal-content') {

      <div class="flex flex-col lg:flex-row gap-6 h-full">

        <div class="flex-1 bg-slate-950/80 rounded-xl border border-cyan-500/30 p-4 relative overflow-hidden flex flex-col items-center justify-center min-h-[380px]">

          <div class="absolute inset-0 bg-[radial-gradient(#06b6d4_1px,transparent_1px)] [background-size:16px_16px] opacity-15"></div>
          
          <!-- Central Clean Grid Core Node -->
          <div class="relative z-10 w-28 h-28 rounded-full bg-slate-900 border-2 border-cyan-400 shadow-[0_0_30px_#06b6d4] flex flex-col items-center justify-center text-center animate-pulse">
            <div class="w-3 h-3 bg-cyan-400 rounded-full mb-1 shadow-[0_0_10px_#22d3ee]"></div>

          <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <svg class="w-full h-full absolute inset-0 pointer-events-none" viewBox="0 0 500 500">
              <defs>
                <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
                  <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
                </linearGradient>
              </defs>
              <!-- Connection Lines from Center (250, 250) to 7 Agent Angles -->
              ${this.renderSvgConnectionLines()}
            </svg>
          </div>

          <!-- Interactive Agent Nodes (Positioned around circle) -->
          <div class="absolute inset-0 pointer-events-auto">
            ${this.renderAgentNodesHtml()}

        <div class="w-full lg:w-80 bg-slate-900/90 rounded-xl border border-slate-800 p-5 flex flex-col justify-between" id="agent-detail-card">

        </div>
      </div>
    `;

    this.attachNodeListeners();

  renderSvgConnectionLines() {
    const cx = 250;
    const cy = 250;
    const radius = 170;
    const total = this.agents.length;

    return this.agents.map((_, i) => {
      const angle = (i / total) * 2 * Math.PI - Math.PI / 2;
      const x = cx + radius * Math.cos(angle);
      const y = cy + radius * Math.sin(angle);
      return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="url(#lineGrad)" stroke-width="1.5" stroke-dasharray="4, 4" class="animate-pulse" />`;
    }).join('');
  }

  renderAgentNodesHtml() {
    const total = this.agents.length;
    const radiusPercent = 38; // Radius in percent from center (50%, 50%)

    return this.agents.map((agent, i) => {
      const angle = (i / total) * 2 * Math.PI - Math.PI / 2;
      const left = 50 + radiusPercent * Math.cos(angle);
      const top = 50 + radiusPercent * Math.sin(angle);
      const isSelected = this.activeAgent && this.activeAgent.id === agent.id;

      return `
        <div class="absolute -translate-x-1/2 -translate-y-1/2 cursor-pointer transition-transform duration-200 hover:scale-110 group"

            <span>${agent.icon}</span>
          </div>
          <div class="text-[9px] font-mono text-center text-slate-300 mt-1 whitespace-nowrap bg-slate-950/80 px-1 py-0.5 rounded border border-slate-800 group-hover:text-cyan-300">
            ${agent.name.split(' ')[0]}
          </div>
        </div>
      `;
    }).join('');
  }

  renderAgentDetailCard(agent) {
    if (!agent) return '';

    return `
      <div>
        <div class="flex items-center gap-3 mb-4">
          <div class="w-12 h-12 rounded-xl bg-slate-800 border border-cyan-500/40 flex items-center justify-center text-2xl shadow-[0_0_12px_#06b6d4]">
            ${agent.icon}
          </div>
          <div>
            <h3 class="text-base font-bold text-white">${agent.name}</h3>
            <div class="text-xs font-mono text-cyan-400">${agent.role}</div>
          </div>
        </div>

        <div class="space-y-3 text-xs">
          <div class="p-3 bg-slate-950/60 rounded-lg border border-slate-800">
            <div class="text-[10px] font-mono text-slate-400 uppercase tracking-wider mb-1">Agent Objective</div>

/**
 * Clean Grid - Commuter Experience Engine (Mode A)
 * Multimodal trip planning, Personal vs City Score optimization,
 * interactive QR scan & ticket verification, anti-cheating confidence engine,
 * Clean Grid Credits rewards wallet, and commuter history.
 */


class CommuterApp {
  constructor() {
    this.destinations = COMMUTER_DESTINATIONS;
    this.selectedDestination = this.destinations[0]; // Default Tech Park
    this.selectedBundle = this.selectedDestination.bundles.find(b => b.isRecommended) || this.selectedDestination.bundles[0];
    this.lockedJourney = null;

    this.wallet = { ...INITIAL_WALLET };
    this.history = [...INITIAL_COMMUTER_HISTORY];

    this.activeTab = 'planner'; // 'planner', 'wallet', 'history'
    this.scanState = {
      isScanning: false,
      verificationResult: null,
      confidenceScore: null,
      scannedQr: null
    };

    this.ticketState = {
      enteredId: '',
      result: null
    };
  }

  // Set destination & recalculate bundles
  selectDestination(destId) {
    const dest = this.destinations.find(d => d.id === destId);
    if (dest) {
      this.selectedDestination = dest;
      this.selectedBundle = dest.bundles.find(b => b.isRecommended) || dest.bundles[0];
      this.lockedJourney = null;
      this.render();

      // Highlight on map
      mapEngine.highlightJourneyRoute([dest.origin.coords, dest.coords], dest.name);
    }
  }

  selectBundle(bundleId) {
    const b = this.selectedDestination.bundles.find(item => item.id === bundleId);
    if (b) {
      this.selectedBundle = b;
      this.render();
    }
  }

  // Lock Journey Flow
  lockCurrentJourney() {
    audioManager.playClick();
    this.lockedJourney = {
      destination: this.selectedDestination,
      bundle: this.selectedBundle,
      lockedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      status: 'AWAITING_VERIFICATION'
    };
    this.render();
  }

  unlockJourney() {
    this.lockedJourney = null;
    this.render();
  }

  // Simulate QR Scan Process
  startDemoScan(qrId) {
    audioManager.playRadarSweep();
    this.scanState.isScanning = true;
    this.scanState.verificationResult = null;
    this.render();

    const selectedQr = SAMPLE_QR_CODES.find(q => q.id === qrId) || SAMPLE_QR_CODES[0];

    // Simulate 1.4s scanning delay
    setTimeout(() => {
      this.scanState.isScanning = false;
      this.scanState.scannedQr = selectedQr;

      if (selectedQr.isValid) {
        audioManager.playVerifySuccess();
        this.scanState.verificationResult = 'VALID';
        this.scanState.confidenceScore = selectedQr.confidence;
      } else {
        audioManager.playErrorBuzz();
        this.scanState.verificationResult = 'FRAUD_DETECTED';
        this.scanState.confidenceScore = selectedQr.confidence;
      }
      this.render();
    }, 1400);
  }

  // Ticket Manual Entry / Quick Fill
  verifyTicketId(ticketId) {
    audioManager.playClick();
    const cleanId = ticketId.trim().toUpperCase();
    const match = VALID_TICKETS.find(t => t.ticketId === cleanId);

    if (match && match.isValid) {
      audioManager.playVerifySuccess();
      this.ticketState.result = {
        isValid: true,
        ticket: match,
        confidence: 97
      };
    } else {
      audioManager.playErrorBuzz();
      this.ticketState.result = {
        isValid: false,
        error: 'Invalid or expired transit credential ID',
        confidence: 0
      };
    }
    this.render();
  }

  // Complete Verified Journey & Award Credits
  completeVerifiedJourney(creditsAwarded = 24, co2SavedKg = 1.1, costSavedInr = 56) {
    audioManager.playCreditsEarned();

    this.wallet.balance += creditsAwarded;
    this.wallet.recentActivity.unshift({
      title: `${this.lockedJourney ? this.lockedJourney.bundle.modeName : 'Multimodal Verified Journey'}`,
      amount: `+${creditsAwarded}`,
      time: 'Just now',
      icon: 'sparkles'
    });

    const newHistoryEntry = {
      id: `hist_${Date.now()}`,
      date: 'Just now',
      journey: `${this.selectedDestination.origin.name} ➔ ${this.selectedDestination.name}`,
      mode: this.lockedJourney ? this.lockedJourney.bundle.modeName : 'Metro + Auto',
      timeMin: this.lockedJourney ? this.lockedJourney.bundle.etaMin : 29,
      cost: `₹${this.lockedJourney ? this.lockedJourney.bundle.costInr : 36}`,
      personalScore: this.lockedJourney ? this.lockedJourney.bundle.personalScore : 86,
      cityScore: this.lockedJourney ? this.lockedJourney.bundle.cityScore : 91,
      creditsEarned: creditsAwarded,
      co2Saved: `${co2SavedKg} kg CO₂`,
      status: 'VERIFIED'
    };

    this.history.unshift(newHistoryEntry);
    this.lockedJourney = null;
    this.scanState = { isScanning: false, verificationResult: null, confidenceScore: null, scannedQr: null };

  // Update live counters smoothly without re-rendering innerHTML
  updateMetricsUi(state) {
    const m = state.metrics;
    const isClean = state.isCleanGridActive;

    const elHealth = document.getElementById('metric-traffic-health');
    const elHealthDesc = document.getElementById('metric-traffic-health-desc');
    const elCommute = document.getElementById('metric-avg-commute');
    const elCommuteDesc = document.getElementById('metric-avg-commute-desc');
    const elTransit = document.getElementById('metric-transit-load');
    const elPollution = document.getElementById('metric-pollution-idx');
    const elPollutionDesc = document.getElementById('metric-pollution-desc');
    const elParking = document.getElementById('metric-parking-pressure');
    const elParkingDesc = document.getElementById('metric-parking-desc');
    const elInterv = document.getElementById('metric-interventions');

    if (elHealth) {
      elHealth.textContent = m.trafficHealth;
      elHealth.className = `text-xl font-black ${isClean ? 'text-emerald-400' : 'text-red-400'}`;
    }
    if (elHealthDesc) {
      elHealthDesc.textContent = isClean ? 'Optimal Flow' : 'Critical Friction';
    }
    if (elCommute) elCommute.textContent = m.avgCommuteMin;
    if (elCommuteDesc) {
      elCommuteDesc.innerHTML = isClean ? '<span class="text-emerald-400">↓ 23% Faster</span>' : '<span class="text-red-400">↑ 18m Delay</span>';
    }
    if (elTransit) elTransit.textContent = m.publicTransitLoad;
    if (elPollution) {
      elPollution.textContent = m.pollutionIndex;
      elPollution.className = `text-xl font-black ${m.pollutionIndex > 60 ? 'text-red-400' : 'text-emerald-400'}`;

class DemoTour {
  constructor(app) {
    this.app = app;
    this.currentStepIndex = 0;
    this.isOpen = false; // Minimized by default as a floating pill for clean map view
  }

  init() {
    this.render();
  }

  setStep(index) {
    audioManager.playClick();
    if (index >= DEMO_STEPS.length) index = 0;
    if (index < 0) index = DEMO_STEPS.length - 1;

    this.currentStepIndex = index;
    const stepObj = DEMO_STEPS[this.currentStepIndex];
    if (stepObj.onEnter) {
      stepObj.onEnter(this.app);
    }
    this.render();
  }

  next() {
    this.setStep(this.currentStepIndex + 1);
  }

  prev() {
    this.setStep(this.currentStepIndex - 1);
  }

  toggleOpen() {
    audioManager.playClick();
    this.isOpen = !this.isOpen;
    this.render();
  }

  render(containerId = 'demo-tour-container') {
    const container = document.getElementById(containerId);
    if (!container) return;

    const cur = DEMO_STEPS[this.currentStepIndex];

    if (!this.isOpen) {
      container.innerHTML = `
        <div class="flex items-center justify-center">
          <button id="reopen-demo-tour-btn" class="px-4 py-1.5 bg-slate-900/90 hover:bg-slate-800 backdrop-blur-md border border-cyan-500/40 text-slate-200 text-xs font-mono rounded-full shadow-[0_0_15px_rgba(6,182,212,0.25)] flex items-center gap-2 transition-all hover:scale-105">
            <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
            <span>🎯 <b>Demo Guide:</b> Step ${cur.step}/10 — ${cur.title.split('. ')[1]}</span>
            <span class="text-cyan-400 font-bold ml-1">Expand ▲</span>
          </button>
        </div>
      `;
      document.getElementById('reopen-demo-tour-btn')?.addEventListener('click', () => this.toggleOpen());
      return;
    }

    container.innerHTML = `
      <div class="p-3 bg-slate-950/95 backdrop-blur-xl border border-cyan-500/50 rounded-2xl shadow-[0_0_30px_rgba(6,182,212,0.3)] flex flex-col md:flex-row items-start md:items-center justify-between gap-3 text-xs w-full max-w-4xl mx-auto">
        <!-- Step Info -->
        <div class="flex items-center gap-3 min-w-0 flex-1">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-500 to-emerald-500 text-slate-950 font-black flex items-center justify-center text-xs shadow-[0_0_10px_#06b6d4] shrink-0">
            ${cur.step}/10
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="font-bold text-white text-xs truncate">${cur.title}</span>
              <span class="px-1.5 py-0.5 rounded bg-cyan-500/20 text-cyan-300 font-mono text-[9px] font-bold border border-cyan-400/40">
                ${cur.tag}
              </span>
            </div>
            <div class="text-slate-300 text-[11px] mt-0.5 leading-snug truncate">${cur.instructions}</div>
          </div>
        </div>

        <!-- Stepper Controls -->
        <div class="flex items-center gap-2 shrink-0">
          <button id="tour-prev-btn" class="px-2.5 py-1.5 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-lg border border-slate-800 font-mono text-xs">
            ◀ Prev
          </button>
          <button id="tour-next-btn" class="px-3.5 py-1.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-lg transition-all shadow-[0_0_12px_#06b6d4] font-mono text-xs whitespace-nowrap">
            ${cur.actionLabel}
          </button>
          <button id="close-tour-btn" class="text-slate-400 hover:text-white px-1.5 py-1 text-sm" title="Minimize Tour">
            ▼
          </button>
        </div>
      </div>
    `;

    document.getElementById('tour-prev-btn')?.addEventListener('click', () => this.prev());
    document.getElementById('tour-next-btn')?.addEventListener('click', () => this.next());
    document.getElementById('close-tour-btn')?.addEventListener('click', () => this.toggleOpen());
  }
}

/**
 * Clean Grid - Main Application Controller
 * India's Adaptive Commute Network
 * Coordinates map engine, simulation engine, commuter app, command center, and demo tour.
 */


class App {
  constructor() {
    this.currentMode = 'command'; // 'command' or 'commuter'
    this.demoTour = new DemoTour(this);
  }

  init() {
    console.log('⚡ Initializing Clean Grid — India\'s Adaptive Commute Network...');

    // 1. Initialize Map Engine
    mapEngine.init('city-map', (node) => {
      commandCenter.openRootCauseModal(node);
    });

    // 2. Initialize Command Center & Commuter App
    commandCenter.init();
    commuterApp.render();

    // 3. Initialize Demo Tour
    this.demoTour.init();

    // 4. Start Simulation Loop (60fps)
    simulationEngine.start();

    // 5. Attach Global UI Event Listeners
    this.attachHeaderListeners();
    this.attachMapHudListeners();
    this.attachModalClosers();
    this.attachKeyboardShortcuts();

    // Render initial mode
    this.switchMode('command');
  }

  switchMode(mode) {
    audioManager.playClick();
    this.currentMode = mode;

    const btnCommand = document.getElementById('mode-btn-command');
    const btnCommuter = document.getElementById('mode-btn-commuter');
    const commuterDrawer = document.getElementById('commuter-view-drawer');
    const commandElements = document.getElementById('command-center-hud');

    if (mode === 'commuter') {
      if (btnCommuter) {
        btnCommuter.className = "px-3.5 py-1.5 rounded-xl bg-cyan-500 text-slate-950 font-bold text-xs tracking-wider shadow-[0_0_15px_#06b6d4] transition-all flex items-center gap-1.5";
      }
      if (btnCommand) {
        btnCommand.className = "px-3.5 py-1.5 rounded-xl bg-slate-900/90 hover:bg-slate-800 text-slate-300 font-mono text-xs border border-slate-800 transition-all flex items-center gap-1.5";
      }

      if (commuterDrawer) commuterDrawer.classList.remove('hidden');
      if (commandElements) commandElements.classList.add('hidden');
      commuterApp.render();
    } else {
      if (btnCommand) {
        btnCommand.className = "px-3.5 py-1.5 rounded-xl bg-cyan-500 text-slate-950 font-bold text-xs tracking-wider shadow-[0_0_15px_#06b6d4] transition-all flex items-center gap-1.5";
      }
      if (btnCommuter) {
        btnCommuter.className = "px-3.5 py-1.5 rounded-xl bg-slate-900/90 hover:bg-slate-800 text-slate-300 font-mono text-xs border border-slate-800 transition-all flex items-center gap-1.5";
      }

      if (commuterDrawer) commuterDrawer.classList.add('hidden');
      if (commandElements) commandElements.classList.remove('hidden');
      mapEngine.clearRouteHighlight();
    }
  }

  attachHeaderListeners() {
    // Mode Switch Buttons
    document.getElementById('mode-btn-command')?.addEventListener('click', () => this.switchMode('command'));
    document.getElementById('mode-btn-commuter')?.addEventListener('click', () => this.switchMode('commuter'));

    // Audio Mute Toggle
    const muteBtn = document.getElementById('audio-mute-toggle-btn');
    if (muteBtn) {
      muteBtn.addEventListener('click', () => {
        const isMuted = audioManager.toggleMute();
        muteBtn.innerHTML = isMuted ? '🔇 <span class="hidden sm:inline">Muted</span>' : '🔊 <span class="hidden sm:inline">Audio</span>';
      });
    }

    // AI Core Modal
    document.getElementById('open-ai-core-btn')?.addEventListener('click', () => {
      audioManager.playClick();
      multiAgentCore.renderModalContent();
      document.getElementById('ai-core-modal')?.classList.remove('hidden');
    });

    // What-If Simulator Modal
    document.getElementById('open-what-if-btn')?.addEventListener('click', () => {
      commandCenter.openWhatIfModal();
    });

    // Emergency Scenario Trigger
    document.getElementById('trigger-emergency-btn')?.addEventListener('click', () => {
      commandCenter.triggerEmergencyScenario();
    });

    // How Clean Grid Works Modal
    document.getElementById('open-how-works-btn')?.addEventListener('click', () => {
      commandCenter.openHowItWorksModal();
    });

    // Final Impact Summary Modal
    document.getElementById('open-impact-summary-btn')?.addEventListener('click', () => {
      this.openImpactReportModal();
    });
  }

  attachMapHudListeners() {
    // Zoom In / Out
    document.getElementById('map-zoom-in')?.addEventListener('click', () => {
      audioManager.playClick();
      mapEngine.map?.zoomIn();
    });
    document.getElementById('map-zoom-out')?.addEventListener('click', () => {
      audioManager.playClick();
      mapEngine.map?.zoomOut();
    });
    document.getElementById('map-reset-view')?.addEventListener('click', () => {
      audioManager.playClick();
      mapEngine.resetView();
    });

    // Layer Toggles
    const setupLayerToggle = (btnId, layerName) => {
      const btn = document.getElementById(btnId);
      if (btn) {
        btn.addEventListener('click', () => {
          audioManager.playClick();
          const isActive = mapEngine.toggleLayer(layerName);
          btn.classList.toggle('text-cyan-400', isActive);
          btn.classList.toggle('border-cyan-400', isActive);
        });
      }
    };

    setupLayerToggle('layer-toggle-metro', 'metro');
    setupLayerToggle('layer-toggle-buses', 'buses');
    setupLayerToggle('layer-toggle-pollution', 'pollution');
  }

  attachModalClosers() {
    const modals = [
      'root-cause-modal',
      'what-if-modal',
      'ai-core-modal',
      'qr-scanner-modal',
      'ticket-verifier-modal',
      'how-it-works-modal',
      'journey-completion-modal',
      'impact-report-modal'
    ];

    modals.forEach(mId => {
      const modal = document.getElementById(mId);
      if (modal) {
        modal.addEventListener('click', (e) => {
          if (e.target === modal) {
            modal.classList.add('hidden');
          }
        });
      }
    });

    document.getElementById('close-ai-core-x')?.addEventListener('click', () => {
      document.getElementById('ai-core-modal')?.classList.add('hidden');
    });
    document.getElementById('close-impact-x')?.addEventListener('click', () => {
      document.getElementById('impact-report-modal')?.classList.add('hidden');
    });
  }

  attachKeyboardShortcuts() {
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (e.key === 'c' || e.key === 'C') this.switchMode('commuter');
      if (e.key === 'm' || e.key === 'M') this.switchMode('command');
      if (e.key === ' ') {
        e.preventDefault();
        audioManager.playActivateCleanGrid();
        simulationEngine.toggleCleanGrid();
      }
      if (e.key === 'e' || e.key === 'E') commandCenter.triggerEmergencyScenario();
    });
  }

  openImpactReportModal() {
    audioManager.playClick();
    const modal = document.getElementById('impact-report-modal');
    if (!modal) return;

              </div>
              <h2 class="text-xl md:text-2xl font-black text-white mt-1">Simulated City-Wide Transportation Gains</h2>
              <p class="text-xs text-slate-400 mt-0.5">Macro performance benchmarks vs uncoordinated baseline</p>
            </div>
            <button id="close-impact-btn-inner" class="text-slate-400 hover:text-white text-lg">✕</button>
          </div>

          <!-- 4 Core Measurable Pillars -->
          <div class="grid grid-cols-2 md:grid-cols-4 gap-2.5 font-mono">
            <div class="p-3.5 bg-slate-950 rounded-xl border border-emerald-500/40 text-center">
              <div class="text-[11px] text-slate-400">Travel Time</div>
              <div class="text-2xl md:text-3xl font-black text-emerald-400 mt-1">↓ 23%</div>
              <div class="text-[9px] text-slate-500 mt-0.5">Peak corridor average</div>
            </div>
            <div class="p-3.5 bg-slate-950 rounded-xl border border-emerald-500/40 text-center">
              <div class="text-[11px] text-slate-400">Congestion</div>
              <div class="text-2xl md:text-3xl font-black text-emerald-400 mt-1">↓ 28%</div>
              <div class="text-[9px] text-slate-500 mt-0.5">Intersection queue delay</div>
            </div>
            <div class="p-3.5 bg-slate-950 rounded-xl border border-cyan-500/40 text-center">
              <div class="text-[11px] text-slate-400">Emissions (CO₂)</div>
              <div class="text-2xl md:text-3xl font-black text-cyan-400 mt-1">↓ 17%</div>
              <div class="text-[9px] text-slate-500 mt-0.5">1.9 tonnes/hr avoided</div>
            </div>
            <div class="p-3.5 bg-slate-950 rounded-xl border border-amber-500/40 text-center">
              <div class="text-[11px] text-slate-400">Bus Delay</div>
              <div class="text-2xl md:text-3xl font-black text-amber-400 mt-1">↓ 64%</div>

            </div>
          </div>

          <!-- Comparison Table -->
          <div class="overflow-x-auto rounded-xl border border-slate-800">
            <table class="w-full text-left text-xs font-mono">
              <thead class="bg-slate-950 text-slate-400 border-b border-slate-800">

              <tbody class="divide-y divide-slate-800/60 bg-slate-900/60 text-slate-300">

                <tr>

                  <td class="p-2.5 text-emerald-400">4.1 min queue wait</td>

    modal.classList.remove('hidden');
  }
}
